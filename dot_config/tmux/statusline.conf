# vim: ft=tmux
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

set -g status "on"
set -g status-interval 1
set -g status-justify "centre"


set -g status-style fg=#586e75,bg=default

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#eee8d5,bg=#00141A]#[fg=#073642,bg=#eee8d5,bold] #S:#I.#P #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=#00141A]"
set -g status-right "#[fg=#93a1a1,bg=#00141A,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h #[fg=#93a1a1,bg=#00141A]"

setw -g window-status-activity-style "underscore,fg=#839496,bg=#00141A"
setw -g window-status-bell-style "default"
setw -g window-status-separator " "
setw -g window-status-style "NONE,fg=#839496,bg=#00141A"
setw -g window-status-format '#[fg=#{?window_bell_flag,##D33682,#b58900},bg=#00141A]#[fg=#{?window_bell_flag,#eee8d5,#00141A},bg=#{?window_bell_flag,##D33682,#b58900},#{?window_bell_flag,bold,nobold}]#I #[fg=#00141A,bg=#93a1a1] #{b:pane_current_path} #[fg=#93a1a1,bg=#00141A]'
setw -g window-status-current-format '#[fg=#{?window_bell_flag,##D33682,#278BD3},bg=#00141A]#[fg=#eee8d5,bg=#{?window_bell_flag,##D33682,#278BD3},bold]#I #[fg=#00141A,bg=#eee8d5,bold] #{b:pane_current_path} #[fg=#eee8d5,bg=#00141A]'
